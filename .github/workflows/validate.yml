name: Validate Rojo project

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  project-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Rojo release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/rojo-rbx/rojo/releases/download/v7.6.1/rojo-7.6.1-linux-x86_64.zip \
            --output "$RUNNER_TEMP/rojo.zip"
          echo "a9542a713036897fdbd0173e7a105ea409658333133c949025fcb6f1a7ca909d  $RUNNER_TEMP/rojo.zip" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/rojo-bin"
          unzip -o "$RUNNER_TEMP/rojo.zip" rojo -d "$RUNNER_TEMP/rojo-bin"
          chmod +x "$RUNNER_TEMP/rojo-bin/rojo"
          echo "$RUNNER_TEMP/rojo-bin" >> "$GITHUB_PATH"
      - name: Install pinned Luau CLI release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/luau-lang/luau/releases/download/0.744/luau-ubuntu.zip \
            --output "$RUNNER_TEMP/luau.zip"
          echo "6506f0852c623aaffcb28494aac16c26dc04a269ea0e16cc0aafc8c8ac79f3ec  $RUNNER_TEMP/luau.zip" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/luau-bin"
          unzip -o "$RUNNER_TEMP/luau.zip" -d "$RUNNER_TEMP/luau-bin"
          chmod +x "$RUNNER_TEMP/luau-bin/luau" "$RUNNER_TEMP/luau-bin/luau-compile" "$RUNNER_TEMP/luau-bin/luau-analyze"
          echo "$RUNNER_TEMP/luau-bin" >> "$GITHUB_PATH"
      - name: Run project, compiler, and combat checks
        run: python3 tests/run_checks.py
      - name: Save place for manual Studio testing
        uses: actions/upload-artifact@v4
        with:
          name: RiftWalkers-prototype
          path: build/RiftWalkers.rbxlx
